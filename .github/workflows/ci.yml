name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake ninja-build qemu-system-x86 ovmf
      - name: Build
        run: cmake -S . -B build -G Ninja && ninja -C build
      - name: Host tests
        run: ctest --test-dir build/host --output-on-failure
      - name: QEMU tests
        run: tools/test.sh m0 && tools/test.sh m1 && tools/test.sh m2 120 && tools/test.sh m3 120 && tools/test.sh m4 120 && tools/test.sh m5 120 && tools/test.sh m6 120 && tools/test.sh m7 300
