<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Lazy VMO / жизненный цикл</title><desc id="d">Commit явный, не demand page fault; W^X разделяет RW и RX; физический discard — отдельная задача.</desc><rect width="1200" height="700" rx="18" fill="#111318"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="28" font-weight="700" fill="#f3d34a">Lazy VMO / жизненный цикл</text>
<rect x="40" y="85" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="117" fill="white" font-size="22">1. VmoReserve / виртуальная резервация</text><text x="64" y="146" fill="#c3cad5" font-size="17">Нулевые индексы отсутствующих кадров; физический backing ещё не выделен</text>
<path d="M600 171v17m-6-6 6 6 6-6" fill="none" stroke="#f3d34a" stroke-width="2"/>
<rect x="40" y="195" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="227" fill="white" font-size="22">2. Map без доступа / PROT_NONE</text><text x="64" y="256" fill="#c3cad5" font-size="17">Неприсутствующие PTE-маркеры удерживают диапазон; доступ запрещён</text>
<path d="M600 281v17m-6-6 6 6 6-6" fill="none" stroke="#f3d34a" stroke-width="2"/>
<rect x="40" y="305" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="337" fill="white" font-size="22">3. Map или protect с доступом / commit</text><text x="64" y="366" fill="#c3cad5" font-size="17">Временные кадры выделяются и обнуляются; при OOM rollback</text>
<path d="M600 391v17m-6-6 6 6 6-6" fill="none" stroke="#f3d34a" stroke-width="2"/>
<rect x="40" y="415" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="447" fill="white" font-size="22">4. Публикация и alias refresh</text><text x="64" y="476" fill="#c3cad5" font-size="17">Индексы обновлены; адрес alias перечитан; права и TLB согласованы</text>
<path d="M600 501v17m-6-6 6 6 6-6" fill="none" stroke="#f3d34a" stroke-width="2"/>
<rect x="40" y="525" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="557" fill="white" font-size="22">5. Частичный unmap → уничтожение VMO</text><text x="64" y="586" fill="#c3cad5" font-size="17">Unmap снимает листья; backing освобождается при освобождении VMO</text>
<text x="40" y="675" font-size="16" fill="#b6bdc9">Commit явный, не demand page fault; W^X разделяет RW и RX; физический discard — отдельная задача.</text></g></svg>