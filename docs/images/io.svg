<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Драйверный I/O / границы доступа</title><desc id="d">Данные и уведомления разделены; shared rings требуют барьеров памяти и явного владения.</desc><rect width="1200" height="700" rx="18" fill="#111318"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="28" font-weight="700" fill="#f3d34a">Драйверный I/O / границы доступа</text>
<rect x="40" y="85" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="117" fill="white" font-size="22">1. Приложение → ядро</text><text x="64" y="146" fill="#c3cad5" font-size="17">Проверка capability; файловая или сетевая операция</text>
<path d="M600 171v17m-6-6 6 6 6-6" fill="none" stroke="#f3d34a" stroke-width="2"/>
<rect x="40" y="195" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="227" fill="white" font-size="22">2. Ядро ↔ userspace-драйвер</text><text x="64" y="256" fill="#c3cad5" font-size="17">VMO-пул и кольца запросов / завершений; канал уведомления</text>
<path d="M600 281v17m-6-6 6 6 6-6" fill="none" stroke="#f3d34a" stroke-width="2"/>
<rect x="40" y="305" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="337" fill="white" font-size="22">3. Драйвер → Device</text><text x="64" y="366" fill="#c3cad5" font-size="17">Разрешённые MMIO / BAR, DMA и IRQ; VT-d при включённом IOMMU</text>
<path d="M600 391v17m-6-6 6 6 6-6" fill="none" stroke="#f3d34a" stroke-width="2"/>
<rect x="40" y="415" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="447" fill="white" font-size="22">4. Устройство → завершение</text><text x="64" y="476" fill="#c3cad5" font-size="17">DMA и MSI / MSI-X; ядро доставляет событие драйверу</text>
<path d="M600 501v17m-6-6 6 6 6-6" fill="none" stroke="#f3d34a" stroke-width="2"/>
<rect x="40" y="525" width="1120" height="82" rx="12" fill="#20252f" stroke="#465060"/><text x="64" y="557" fill="white" font-size="22">5. Драйвер → ядро → приложение</text><text x="64" y="586" fill="#c3cad5" font-size="17">IRQ ack, завершение запроса и возврат владения буфером</text>
<text x="40" y="675" font-size="16" fill="#b6bdc9">Данные и уведомления разделены; shared rings требуют барьеров памяти и явного владения.</text></g></svg>